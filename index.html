  <!-- MODAL FILME -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharModal()">&times;</span>
      <img id="imgFilme" class="modal-img">
      <div class="modal-texto">
        <h2 id="tituloFilme"></h2>
        <p id="sinopseFilme"></p>
        <button onclick="darNota(1)">⭐</button>
        <button onclick="darNota(2)">⭐⭐</button>
        <button onclick="darNota(3)">⭐⭐⭐</button>
      </div>
    </div>
  </div>

  <!-- MODAL LOGIN - VERSÃO NOVA COM BANCO -->
  <div id="modal-login" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fecharLogin()">&times;</span>
      <h2>Entrar / Cadastrar</h2>
      <input type="text" id="nome-usuario" placeholder="Nome real">
      <input type="text" id="apelido-usuario" placeholder="Apelido">
      <input type="email" id="email-usuario" placeholder="Email">
      <input type="password" id="senha-usuario" placeholder="Senha">
      <div style="margin-top:10px">
        <button onclick="banco.login()">Entrar</button>
        <button onclick="banco.cadastrar()">Criar conta</button>
